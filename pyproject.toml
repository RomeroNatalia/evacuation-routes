[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-evacuation-qubo-capstone"
version = "1.1.0"
description = "Five-floorplan static capacity-aware fire-evacuation route assignment using Dijkstra, simulated annealing, D-Wave Hybrid, and a direct D-Wave QPU."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "dwave-ocean-sdk>=9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]